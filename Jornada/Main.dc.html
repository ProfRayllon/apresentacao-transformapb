<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jornada Formativa — Cartilhas</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffffff}a:hover{color:#ffe7c2}
.jf-root *{box-sizing:border-box}
.jf-root button{font-family:inherit;cursor:pointer}
.jf-root button:focus-visible{outline:4px solid #ffffff;outline-offset:6px}
@keyframes jfSpin{to{transform:rotate(360deg)}}
@keyframes jfSpinRev{to{transform:rotate(-360deg)}}
@keyframes jfPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.32);opacity:0}}
@keyframes jfFadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes jfFade{from{opacity:0}to{opacity:1}}
@keyframes jfPop{0%{opacity:0;transform:scale(.6) rotate(-6deg)}70%{opacity:1;transform:scale(1.04) rotate(1deg)}100%{opacity:1;transform:none}}
@keyframes jfBookIn{from{opacity:0;transform:translateX(-120px) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes jfFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-18px) rotate(1deg)}}
@keyframes jfShadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.82);opacity:.2}}
@keyframes jfReveal{from{clip-path:circle(0% at var(--ox,35%) var(--oy,55%))}to{clip-path:circle(150% at var(--ox,35%) var(--oy,55%))}}
@keyframes jfBlink{0%,100%{opacity:1;transform:scaleX(1)}50%{opacity:.35;transform:scaleX(.6)}}
@keyframes jfBlob{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-24px) scale(1.06)}}
.jf-home{animation:jfFade .5s ease both}
.jf-badge{position:relative;width:226px;height:226px;border:0;padding:0;border-radius:50%;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .35s}
.jf-badge:hover{transform:scale(1.1);box-shadow:0 22px 44px rgba(10,14,60,.45)}
.jf-badge:active{transform:scale(.97)}
.jf-badge .jf-ring{animation:jfSpin 38s linear infinite;transform-origin:50% 50%}
.jf-badge .jf-pulse{position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.7);animation:jfPulse 2.8s ease-out infinite;pointer-events:none}
.jf-qrcard{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.jf-qrcard:hover{transform:scale(1.03) rotate(.5deg)}
.jf-blob{animation:jfBlob 14s ease-in-out infinite}
.jf-detail{animation:jfReveal .9s cubic-bezier(.7,0,.2,1) both;transition:background-color .7s ease}
.jf-in1{animation:jfFadeUp .7s .25s cubic-bezier(.2,.8,.2,1) both}
.jf-in2{animation:jfFadeUp .7s .38s cubic-bezier(.2,.8,.2,1) both}
.jf-in3{animation:jfFadeUp .7s .5s cubic-bezier(.2,.8,.2,1) both}
.jf-pop{animation:jfPop .8s .45s cubic-bezier(.2,.8,.2,1) both}
.jf-bookin{animation:jfFade .6s .2s ease both}
.jf-bigring{animation:jfSpin 60s linear infinite;transform-origin:50% 50%}
.jf-back{transition:transform .25s,background .25s}
.jf-back:hover{transform:translateX(-6px);background:rgba(255,255,255,.28)}
.jf-mini{transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.jf-mini:hover{transform:scale(1.14) translateY(-4px)}
</style>
</helmet>

<div class="jf-root" style="position: relative; width: 1600px; height: 900px; overflow: hidden; font-family: Montserrat, system-ui, sans-serif; color: #ffffff; background: #7B78B8">

  <!-- ============ TELA INICIAL ============ -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <div class="jf-home" style="position: absolute; inset: 0">
      <!-- formas de fundo -->
      <div aria-hidden="true" class="jf-blob" style="position: absolute; left: -260px; top: -320px; width: 900px; height: 820px; border-radius: 50%; background: #C88ABE"></div>
      <div aria-hidden="true" class="jf-blob" style="position: absolute; left: 520px; top: -420px; width: 620px; height: 640px; border-radius: 50%; background: #77C3A5; animation-delay: -4s"></div>
      <div aria-hidden="true" class="jf-blob" style="position: absolute; left: -420px; top: 380px; width: 820px; height: 900px; border-radius: 50%; background: #F28B62; animation-delay: -7s"></div>
      <div aria-hidden="true" class="jf-blob" style="position: absolute; left: 380px; top: 640px; width: 640px; height: 600px; border-radius: 50%; background: #C88ABE; animation-delay: -11s"></div>
      <div aria-hidden="true" class="jf-blob" style="position: absolute; right: -300px; top: 360px; width: 760px; height: 900px; border-radius: 50%; background: #77C3A5; animation-delay: -2s"></div>

      <!-- cartão principal -->
      <div style="position: absolute; left: 44px; top: 44px; width: 1512px; height: 812px; border-radius: 64px; background: #5A66AD; padding: 36px 64px 34px 56px; display: grid; grid-template-columns: minmax(0, 1fr) 480px; gap: 56px">

        <!-- coluna esquerda -->
        <div style="display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-width: 0">

          <!-- faixa do logo -->
          <div style="position: relative; width: 100%; height: 150px; border-radius: 48px; overflow: hidden; background: #7B78B8; display: flex; align-items: center; justify-content: center">
            <div aria-hidden="true" style="position: absolute; left: 180px; top: -160px; width: 480px; height: 440px; border-radius: 50%; background: #C88ABE"></div>
            <div aria-hidden="true" style="position: absolute; left: -80px; top: -40px; width: 420px; height: 320px; border-radius: 46% 54% 40% 60%; background: #F28B62"></div>
            <div aria-hidden="true" style="position: absolute; left: 540px; top: -40px; width: 300px; height: 340px; border-radius: 60% 40% 50% 50%; background: #77C3A5"></div>
            <div style="position: relative; display: flex; flex-direction: column; gap: 2px; margin-left: 48px">
              <img src="./assets/24bbb5eb015929b0ccd8ecb3e96cce30.png" alt="Jornada Formativa" style="height: 96px; width: auto; display: block">
              <div style="margin-left: 156px; font-size: 25px; font-weight: 500; letter-spacing: .02em">Educação Sem Barreiras</div>
            </div>
          </div>

          <!-- selos -->
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 112px">
            <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
              <button class="jf-badge" type="button" onClick="{{item.pick}}" aria-label="Abrir cartilha: {{item.name}}" style="background: {{item.badge}}">
                <span class="jf-pulse" style="animation-delay: {{item.delay}}"></span>
                <svg class="jf-ring" aria-hidden="true" width="226" height="226" viewBox="0 0 212 212" style="position: absolute; inset: 0">
                  <defs><path id="{{item.pathId}}" d="M106,106 m-79,0 a79,79 0 1,1 158,0 a79,79 0 1,1 -158,0"></path></defs>
                  <circle cx="106" cy="106" r="95" fill="none" stroke="#1C1C2E" stroke-width="1.1"></circle>
                  <circle cx="106" cy="106" r="63" fill="none" stroke="#1C1C2E" stroke-width="1.1"></circle>
                  <text fill="#1C1C2E" font-family="Montserrat, sans-serif" font-size="{{item.fs}}" dy="3.6"><textPath href="{{item.pathHref}}" textLength="490" lengthAdjust="spacing"><tspan font-weight="800">{{item.ringBold}}</tspan><tspan font-weight="400">{{item.ringLight}}</tspan></textPath></text>
                </svg>
                <span style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
                  <img src="{{item.icon}}" alt="" style="height: {{item.iconH}}; width: auto; display: block">
                </span>
              </button>
            </sc-for>
          </div>

          <!-- rodapé -->
          <img src="./assets/d48a699e91c5878746fab9b2fbeb501f.png" alt="Gerência Executiva de Formação e Desenvolvimento dos Profissionais de Educação · Secretaria de Estado da Educação · Governo da Paraíba" style="width: 660px; height: auto; display: block">
        </div>

        <!-- coluna direita: QR -->
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 24px; padding-bottom: 6px">
          <div class="jf-qrcard" style="width: 480px; height: 480px; border-radius: 42px; background: #ffffff; padding: 22px; box-shadow: 0 24px 50px rgba(20,24,70,.28)">
            <img src="./assets/95205d4e24ed386135438e6633b7d3ad.png" alt="QR Code para o Instagram @educaformapb" style="width: 100%; height: 100%; object-fit: contain; display: block">
          </div>
          <a href="https://www.instagram.com/educaformapb" style="display: block; width: 480px; text-align: center; padding: 14px 24px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1.5px solid rgba(255,255,255,.28); font-size: 32px; font-weight: 400; letter-spacing: .02em; text-decoration: none; color: #ffffff; white-space: nowrap">@educaformapb</a>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- ============ TELA DA CARTILHA ============ -->
  <sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
    <div class="jf-detail" style="position: absolute; inset: 0; background-color: {{cur.bg}}; --ox: {{cur.ox}}; --oy: {{cur.oy}}">
      <!-- decoração -->
      <div aria-hidden="true" class="jf-blob" style="position: absolute; right: -160px; top: -220px; width: 640px; height: 640px; border-radius: 50%; background: rgba(255,255,255,.08)"></div>
      <div aria-hidden="true" class="jf-blob" style="position: absolute; left: -260px; bottom: -320px; width: 760px; height: 760px; border-radius: 50%; background: rgba(0,0,0,.10); animation-delay: -6s"></div>
      <svg aria-hidden="true" class="jf-bigring" width="760" height="760" viewBox="0 0 212 212" style="position: absolute; left: -10px; top: 110px; opacity: .16">
        <defs><path id="jf-big-path" d="M106,106 m-92,0 a92,92 0 1,1 184,0 a92,92 0 1,1 -184,0"></path></defs>
        <circle cx="106" cy="106" r="104" fill="none" stroke="#ffffff" stroke-width=".6"></circle>
        <circle cx="106" cy="106" r="80" fill="none" stroke="#ffffff" stroke-width=".6"></circle>
        <text fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="700" font-size="9.4" dy="3"><textPath href="#jf-big-path" textLength="575" lengthAdjust="spacing">{{cur.ring}}</textPath></text>
      </svg>

      <!-- barra superior -->
      <div style="position: absolute; left: 64px; right: 64px; top: 44px; display: flex; align-items: center; justify-content: space-between">
        <button class="jf-back" type="button" onClick="{{goHome}}" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 26px 0 20px; border: 0; border-radius: 999px; background: rgba(255,255,255,.18); color: #ffffff; font-size: 17px; font-weight: 700; letter-spacing: .04em">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
          VOLTAR ÀS JORNADAS
        </button>
        <img src="./assets/24bbb5eb015929b0ccd8ecb3e96cce30.png" alt="Jornada Formativa" style="height: 50px; width: auto; display: block">
      </div>

      <sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: 64px; right: 72px; top: 124px; bottom: 40px; display: grid; grid-template-columns: 500px minmax(0, 1fr) 400px; gap: 48px; align-items: center">

          <!-- e-book -->
          <div class="jf-bookin" style="position: relative; height: 100%; display: flex; align-items: center; justify-content: center">
            <div aria-hidden="true" style="position: absolute; bottom: 18px; left: 90px; right: 90px; height: 34px; border-radius: 50%; background: #000000; opacity: .3; filter: blur(14px)"></div>
            <img src="{{cur.book}}" alt="Capa da cartilha {{cur.name}}" style="position: relative; max-height: 650px; max-width: 100%; width: auto; display: block; filter: drop-shadow(0 30px 30px rgba(0,0,0,.30))">
          </div>

          <!-- informações -->
          <div style="display: flex; flex-direction: column; gap: 28px; min-width: 0">
            <div class="jf-in1" style="display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 14px; font-weight: 800; letter-spacing: .16em">
              <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"></path><path d="M20 17v4H6.5A2.5 2.5 0 0 1 4 19.5"></path></svg>
              CARTILHA DE ORIENTAÇÃO
            </div>
            <img class="jf-in2" src="{{cur.lockup}}" alt="{{cur.name}}" style="width: 100%; max-width: 520px; height: auto; display: block">
            <p class="jf-in3" style="margin: 0; font-size: 22px; font-weight: 500; line-height: 1.45; max-width: 460px">Aponte a câmera do celular para o QR Code e acesse o e-book completo.</p>

            <div class="jf-in3" style="display: flex; flex-direction: column; gap: 14px; margin-top: 12px">
              <div style="font-size: 13px; font-weight: 800; letter-spacing: .16em; opacity: .85">OUTRAS JORNADAS</div>
              <div style="display: flex; gap: 16px">
                <sc-for list="{{others}}" as="o" hint-placeholder-count="4">
                  <button class="jf-mini" type="button" onClick="{{o.go}}" aria-label="{{o.name}}" style="position: relative; width: 64px; height: 64px; border-radius: 50%; border: 0; padding: 0; background: {{o.badge}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(0,0,0,.2)">
                    <sc-if value="{{o.active}}" hint-placeholder-val="{{ false }}">
                      <span aria-hidden="true" style="position: absolute; inset: -7px; border-radius: 50%; border: 3px solid #ffffff"></span>
                    </sc-if>
                    <img src="{{o.icon}}" alt="" style="height: 30px; width: auto; display: block">
                  </button>
                </sc-for>
              </div>
            </div>
          </div>

          <!-- QR -->
          <div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
            <div class="jf-in1" style="padding: 14px 32px; border-radius: 999px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.24); color: #ffffff; font-size: 24px; font-weight: 700; letter-spacing: .06em; line-height: 1">ACESSE A CARTILHA</div>
            <div class="jf-pop" style="width: 400px; height: 400px">
              <a class="jf-qrcard" href="{{cur.link}}" aria-label="Abrir e-book {{cur.name}}" style="display: block; width: 100%; height: 100%; border-radius: 36px; background: #ffffff; padding: 20px; box-shadow: 0 26px 50px rgba(0,0,0,.28)">
                <img src="{{cur.qr}}" alt="QR Code da cartilha {{cur.name}}" style="width: 100%; height: 100%; object-fit: contain; display: block">
              </a>
            </div>
            <div class="jf-in3" style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; opacity: .92">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>
              Escaneie com a câmera do celular
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<style>#deck-ctrl{position:fixed;right:20px;bottom:20px;z-index:9999;display:flex;gap:10px}#deck-ctrl>a{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,14,60,.55);opacity:.4;transition:opacity .25s,transform .25s}#deck-ctrl>a:hover,#deck-ctrl>a:focus-visible{opacity:1;transform:scale(1.08)}#deck-ctrl img{width:28px;height:28px;object-fit:contain}</style>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}.jf-root{position:fixed!important;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--jf-s,1));transform-origin:center}</style>
<script>
(function(){
  function fit(){ document.documentElement.style.setProperty('--jf-s', Math.min(innerWidth/1600, innerHeight/900)); }
  fit(); addEventListener('resize', fit);
  function fs(){ var d=document; try{ d=window.top.document; }catch(e){} var r=d.documentElement, req=r.requestFullscreen||r.webkitRequestFullscreen; if(!(d.fullscreenElement||d.webkitFullscreenElement) && req){ try{ var pr=req.call(r); if(pr&&pr.catch) pr.catch(function(){}); }catch(e){} } }
  document.addEventListener('click', fs, true); document.addEventListener('keydown', fs, true);
})();
</script>
<div id="deck-ctrl"><a href="../Transforma%20Educacao%20PB%202026.dc.html" onclick="try{if(window.top!==window&amp;&amp;window.top.mostrar){event.preventDefault();window.top.mostrar('transforma')}}catch(e){}" title="Transforma Educação PB 2026" aria-label="Abrir apresentação Transforma"><img src="./assets/icone-transforma.png" alt=""></a></div>
<script type="text/x-dc" data-dc-script data-props='{"start":{"editor":"enum","default":"home","options":["home","antirr","paz","mulher","sust"],"section":"Pré-visualização"},"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: undefined, show: true };
    this.timer = null;
  }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  data() {
    return [
      { id: 'antirr', name: 'Minha Escola é Antirracista', badge: '#F28B62', bg: '#C9461C', ox: '30%', oy: '47%',
        icon: './assets/0f6c14f41c2346869ad9bfb1ae0150d6.png', iconH: '74px', fs: '9.6',
        lockup: './assets/f46117d66682189159cf26bd0919456d.png', book: './assets/bc9782d336914ca55e1398b9a5be7159.png',
        qr: './assets/4c42be8f3f4bfe47fad65cffddf8a39a.png', link: 'https://drive.google.com/file/d/1gHeY7I48CuWTujOQWpoVuR_J3o48BL5B/view?usp=drive_link',
        ringBold: 'MINHA ESCOLA É ANTIRRACISTA', ringLight: ' • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •', ring: 'MINHA ESCOLA É ANTIRRACISTA • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •' },
      { id: 'paz', name: 'Cultura de Paz nas Escolas', badge: '#7A73B5', bg: '#4F33A6', ox: '50%', oy: '47%',
        icon: './assets/22b122291d492702966e943269c2d3d3.png', iconH: '66px', fs: '9.6',
        lockup: './assets/8f6915904da1f41b39ee762cc2020cac.png', book: './assets/c79845121cba77f4fd1690608d9fa303.png',
        qr: './assets/fe0b304f6c185dc02578223f66f1a617.png', link: 'https://drive.google.com/file/d/12FgFut41YfHMDejPxs0S3rj49tFHr0Vl/view?usp=drivesdk',
        ringBold: 'CULTURA DE PAZ NAS ESCOLAS', ringLight: ' • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •', ring: 'CULTURA DE PAZ NAS ESCOLAS • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •' },
      { id: 'mulher', name: 'Prevenção e Enfrentamento à Violência contra a Mulher', badge: '#C88ABE', bg: '#B12F7C', ox: '30%', oy: '75%',
        icon: './assets/a5f1a31242c19d964bacb0352f503e41.png', iconH: '70px', fs: '8.3',
        lockup: './assets/9efaaf0f9c4e7a738e4ecf425d3f0d10.png', book: './assets/206b03b5e0b574742bf2e699d0bd1ebf.png',
        qr: './assets/88954c2a779a03319934c8dd1b3b8f6c.png', link: 'https://drive.google.com/file/d/1g5r2MGuSxCbostLI9WztA4Q1LpIFRnIW/view?usp=drivesdk',
        ringBold: 'ENFRENTAMENTO À VIOLÊNCIA CONTRA A MULHER', ringLight: ' • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •', ring: 'ENFRENTAMENTO À VIOLÊNCIA CONTRA A MULHER • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •' },
      { id: 'sust', name: 'Escola Sustentável', badge: '#77C3A5', bg: '#0B7F76', ox: '50%', oy: '75%',
        icon: './assets/54fbd6e37ca4c5343bacdf5dfc4ec5c0.png', iconH: '52px', fs: '11.2',
        lockup: './assets/1bbe421ed83a230166aa00e60dedcc0c.png', book: './assets/61e2a48944217255be4a45acaf0252c3.png',
        qr: './assets/d09a10159f33ae4e11992763eb0be194.png', link: '#',
        ringBold: 'ESCOLA SUSTENTÁVEL', ringLight: ' • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •', ring: 'ESCOLA SUSTENTÁVEL • JORNADA FORMATIVA • EDUCAÇÃO SEM BARREIRAS •' }
    ];
  }
  goTo(id) {
    if (this.timer) clearTimeout(this.timer);
    this.setState({ show: false });
    this.timer = setTimeout(() => this.setState({ sel: id, show: true }), 40);
  }
  renderVals() {
    const list = this.data();
    const start = this.props.start ?? 'home';
    const sel = this.state.sel === undefined ? (start === 'home' ? null : start) : this.state.sel;
    const cur = list.find((x) => x.id === sel) || list[0];
    const items = list.map((x, i) => ({
      ...x,
      pathId: 'jf-ring-' + x.id,
      pathHref: '#jf-ring-' + x.id,
      delay: (i * 0.7) + 's',
      pick: () => this.setState({ sel: x.id, show: true })
    }));
    const others = list.map((x) => ({
      ...x,
      active: x.id === sel,
      go: () => { if (x.id !== sel) this.goTo(x.id); }
    }));
    return {
      items,
      others,
      cur,
      isHome: !sel,
      isDetail: !!sel,
      show: this.state.show,
      goHome: () => this.setState({ sel: null, show: true })
    };
  }
}
</script>
</body>
</html>
