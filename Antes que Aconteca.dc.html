<script type="text/x-dc" data-dc-script data-props="{&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;unit&quot;:&quot;×&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.anims = []; this.timers = []; this.pending = new Set();
    // Modo de passagem: loop automático (padrão) ou manual. Vem do menu inicial (?modo=) ou da última escolha salva.
    let salvo = null; try { salvo = localStorage.getItem('apresentacao-modo'); } catch (e) {}
    this.manual = (new URLSearchParams(location.search).get('modo') || salvo) === 'manual';
    this.noRail =() => { const dk = document.querySelector('deck-stage'); if (dk && !dk.hasAttribute('no-rail')) dk.setAttribute('no-rail', ''); const sr = dk && dk.shadowRoot; if (sr && !sr.querySelector('style[data-hide-ui]')) { const st = document.createElement('style'); st.setAttribute('data-hide-ui', ''); st.textContent = '.overlay{display:none!important}'; sr.appendChild(st); } };
    this.noRail();
    this.fs = () => { let d = document; try { d = window.top.document; } catch (e) {} const r = d.documentElement, req = r.requestFullscreen || r.webkitRequestFullscreen; if (!(d.fullscreenElement || d.webkitFullscreenElement) && req) { try { const pr = req.call(r); if (pr && pr.catch) pr.catch(() => {}); } catch (e) {} return true; } return false; };
    this.onClick = (e) => { const entrou = this.fs(); if (e && e.target && e.target.closest && e.target.closest('#deck-ctrl')) return; if (entrou) return; this.togglePause(); };
    document.addEventListener('click', this.onClick); document.addEventListener('keydown', this.fs);
    this.buildCtrl();
    this.onChange = (e) => (this.noRail(), this.play(e.detail.slide, e.detail.index, e.detail.total));
    document.addEventListener('slidechange', this.onChange);
    this.boot = setTimeout(() => {
      this.noRail();
      const deck = document.querySelector('deck-stage');
      const s = document.querySelector('deck-stage > section[data-deck-active]');
      if (deck && s && !this.current) { const all = [...deck.querySelectorAll(':scope > section')]; this.play(s, all.indexOf(s), all.length); }
    }, 400);
  }
  buildCtrl() {
    if (document.getElementById('deck-ctrl')) return;
    const css = document.createElement('style');
    css.textContent = '#deck-ctrl{position:fixed;right:20px;bottom:20px;z-index:9999;display:flex;gap:10px}#deck-ctrl>*{width:46px;height:46px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(59,0,144,.6);color:#fff;cursor:pointer;opacity:.4;transition:opacity .25s,transform .25s;text-decoration:none}#deck-ctrl>*:hover,#deck-ctrl>*:focus-visible{opacity:1;transform:scale(1.08)}#deck-ctrl>.ctrl-modo{width:auto;padding:0 18px 0 14px;gap:8px;border-radius:999px;font:700 13px Archivo,sans-serif;letter-spacing:.12em}#deck-ctrl>.ctrl-seta{width:36px;height:36px;margin-top:5px;background:rgba(128,128,150,.28);opacity:.35}';
    document.head.appendChild(css);
    const box = document.createElement('div'); box.id = 'deck-ctrl';
    const btn = (fn) => { const b = document.createElement('button'); b.type = 'button'; b.addEventListener('click', e => { e.stopPropagation(); fn(); }); return b; };
    const menu = document.createElement('a'); menu.href = 'index.html#menu'; menu.title = 'Voltar ao menu de apresentações'; menu.setAttribute('aria-label', menu.title);
    menu.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>';
    menu.addEventListener('click', e => e.stopPropagation());
    const md = btn(() => this.toggleModo()); md.className = 'ctrl-modo';
    const ant = btn(() => this.passo(-1)), prox = btn(() => this.passo(1));
    ant.title = 'Anterior'; prox.title = 'Próximo'; ant.className = prox.className = 'ctrl-seta';
    ant.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
    prox.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
    const pb = btn(() => this.togglePause());
    box.append(menu, pb, ant, prox); document.body.appendChild(box);
    this.pauseBtn = pb; this.modoBtn = md; this.antBtn = ant; this.proxBtn = prox; this.updateCtrl();
  }
  auto() { return (this.props.autoplay ?? true) && !this.manual; }
  toggleModo() {
    this.manual = !this.manual;
    try { localStorage.setItem('apresentacao-modo', this.manual ? 'manual' : 'loop'); } catch (e) {}
    if (this.manual) { clearTimeout(this.advance); this.advanceAt = 0; }
    else if (this.current && !this.paused) { this.remaining = (+this.current.dataset.duration || 8000) / (this.props.speed ?? 1); this.armAdvance(); }
    this.updateCtrl();
    this.showBadge(this.manual ? '✋  Modo manual · use ← →' : '↻  Loop automático');
  }
  passo(d) {
    const deck = document.querySelector('deck-stage'); if (!deck || !deck.goTo) return;
    const all = [...deck.querySelectorAll(':scope > section')], i = all.indexOf(this.current);
    deck.goTo(Math.max(0, Math.min(all.length - 1, i + d)));
  }
  updateCtrl() {
    const md = this.modoBtn;
    if (md) {
      md.title = this.manual ? 'Modo manual — clique para passar em loop' : 'Loop automático — clique para passar manualmente'; md.setAttribute('aria-label', md.title);
      md.innerHTML = this.manual
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4l10 8-10 8z"/><rect x="16" y="4" width="4" height="16" rx="1"/></svg>MANUAL'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg>LOOP';
    }
    if (this.antBtn) this.antBtn.style.display = this.proxBtn.style.display = this.manual ? '' : 'none';
    const pb = this.pauseBtn; if (!pb) return;
    pb.title = this.paused ? 'Reproduzir' : 'Pausar'; pb.setAttribute('aria-label', pb.title);
    pb.innerHTML = this.paused
      ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l14 8-14 8z"/></svg>'
      : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1"/><rect x="14" y="4" width="5" height="16" rx="1"/></svg>';
  }
  componentWillUnmount() { document.removeEventListener('slidechange', this.onChange); document.removeEventListener('click', this.onClick); document.removeEventListener('keydown', this.fs); clearTimeout(this.boot); this.stop(); }
  stop() {
    this.anims.forEach(a => { try { a.cancel(); } catch (e) {} });
    this.timers.forEach(t => { clearTimeout(t); cancelAnimationFrame(t); });
    this.anims = []; this.timers = []; this.pending = new Set(); clearTimeout(this.advance); this.advanceAt = 0;
  }
  armAdvance() {
    clearTimeout(this.advance);
    this.advanceAt = Date.now();
    this.advance = setTimeout(() => { const d = document.querySelector('deck-stage'); if (d && d.goTo) d.goTo(this.nextIndex); }, this.remaining);
  }
  togglePause(silencioso) {
    this.paused = !this.paused;
    if (this.paused) {
      clearTimeout(this.advance);
      if (this.advanceAt) this.remaining = Math.max(1500, this.remaining - (Date.now() - this.advanceAt));
      document.getAnimations().forEach(a => { if (a.playState === 'running') a.pause(); });
      this.pending.forEach(o => { clearTimeout(o.id); o.ms = Math.max(0, o.ms - (Date.now() - o.at)); });
    } else {
      document.getAnimations().forEach(a => { if (a.playState === 'paused') a.play(); });
      this.pending.forEach(o => { o.at = Date.now(); o.id = setTimeout(o.run, o.ms); this.timers.push(o.id); });
      if (this.nextIndex != null && this.auto()) this.armAdvance();
    }
    this.updateCtrl();
    if (!silencioso) this.showBadge(this.paused ? '❚❚  Pausado' : '▶  Reproduzindo');
  }
  showBadge(text) {
    let b = document.getElementById('pause-badge');
    if (!b) { b = document.createElement('div'); b.id = 'pause-badge'; b.style.cssText = 'position:fixed;right:20px;bottom:78px;z-index:9999;background:rgba(59,0,144,.85);color:#fff;font:600 16px Archivo,sans-serif;letter-spacing:.08em;padding:10px 18px;border-radius:999px;pointer-events:none;transition:opacity .4s'; document.body.appendChild(b); }
    b.textContent = text; b.style.opacity = 1;
    clearTimeout(this.badgeT);
    if (!this.paused) this.badgeT = setTimeout(() => { b.style.opacity = 0; }, 1200);
  }
  later(fn, ms) {
    const o = { fn, ms, at: Date.now() };
    o.run = () => { this.pending.delete(o); fn(); };
    this.pending.add(o);
    if (!this.paused) { o.id = setTimeout(o.run, ms); this.timers.push(o.id); }
  }
  fmt(n) { return Math.round(n) >= 2000 && Math.round(n) <= 2100 ? String(Math.round(n)) : Math.round(n).toLocaleString('pt-BR'); }
  count(el, from, to, dur, delay) {
    el.textContent = this.fmt(from);
    this.later(() => {
      let last = Date.now(), el2 = 0;
      const step = () => {
        const now = Date.now(); el2 += Math.min(now - last, 60); last = now;
        const p = Math.min(1, el2 / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = this.fmt(from + (to - from) * e);
        if (p < 1) this.later(step, 30);
      };
      step();
    }, delay);
  }
  play(slide, index, total) {
    if (!slide) return;
    this.stop(); this.current = slide;
    if (this.paused) { this.paused = false; this.updateCtrl(); this.showBadge('▶  Reproduzindo'); }
    const speed = this.props.speed ?? 1;
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduce) this.animate(slide);
    this.nextIndex = (index + 1) % total;
    this.remaining = (+slide.dataset.duration || 8000) / speed;
    if (this.auto() && !this.paused) this.armAdvance();
  }
  animate(slide) {
    const ease = 'cubic-bezier(.22,1,.36,1)';
    const run = (el, kf, o) => { const a = el.animate(kf, Object.assign({ fill: 'backwards', easing: ease }, o)); this.anims.push(a); };
    slide.querySelectorAll('[data-anim]').forEach(el => {
      const t = el.dataset.anim, d = (+el.dataset.delay || 0) + (/wipe|sobe|lado|suave/.test(t) ? 0 : 900);
      if (t === 'up') run(el, [{ opacity: 0, transform: 'translateY(48px)' }, { opacity: 1, transform: 'none' }], { duration: 900, delay: d });
      else if (t === 'fade') run(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: d });
      else if (t === 'zoom') run(el, [{ transform: 'scale(1.12)', opacity: .4 }, { transform: 'scale(1)', opacity: 1 }], { duration: 2600, delay: d });
      else if (t === 'wipe') run(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(0)', offset: .25 }, { transform: 'translateY(-101%)' }], { duration: 2200, delay: d, easing: 'cubic-bezier(.76,0,.24,1)' });
      else if (t === 'wipe2') run(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(0)', offset: .35 }, { transform: 'translateY(-101%)' }], { duration: 2450, delay: d, easing: 'cubic-bezier(.76,0,.24,1)' });
      // Transições dos slides do PDF: o novo slide surge por cima do anterior com um leve deslize (de baixo = novo assunto, do lado = continuação) ou só em fade (capa e encerramento)
      else if (t === 'sobe') run(el, [{ opacity: 0, transform: 'translateY(5%)' }, { opacity: 1, transform: 'none' }], { duration: 1500, delay: d, easing: 'cubic-bezier(.22,1,.36,1)' });
      else if (t === 'lado') run(el, [{ opacity: 0, transform: 'translateX(4%)' }, { opacity: 1, transform: 'none' }], { duration: 1400, delay: d, easing: 'cubic-bezier(.22,1,.36,1)' });
      else if (t === 'suave') run(el, [{ opacity: 0, transform: 'scale(1.025)' }, { opacity: 1, transform: 'none' }], { duration: 1800, delay: d, easing: 'cubic-bezier(.22,1,.36,1)' });
      else if (t === 'bar') run(el, [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: 1400, delay: d });
      else if (t === 'pop') run(el, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'none' }], { duration: 800, delay: d, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      else if (t === 'cert') run(el, [{ opacity: 0, transform: 'translateY(120px) rotate(6deg) scale(.9)' }, { opacity: 1, transform: 'rotate(-2deg)' }], { duration: 1200, delay: d });
      else if (t === 'barY') run(el, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 1200, delay: d });
    });
    slide.querySelectorAll('[data-count]').forEach(el => this.count(el, el.hasAttribute('data-raw') ? +el.dataset.count - 30 : 0, +el.dataset.count, 1800, (+el.dataset.delay || 0) + 900));
    // Itens interativos: o destaque passa sozinho pela lista e também pode ser escolhido com um toque.
    slide.querySelectorAll('[data-cycle]').forEach(box => {
      const tok = this.seq = (this.seq || 0) + 1, items = [...box.querySelectorAll('[data-ci]')], hold = +box.dataset.hold || 3000;
      const cv = slide.querySelector('[data-cv]');
      let cur = -1;
      const pick = (k, manual) => {
        cur = k;
        items.forEach((it, j) => it.toggleAttribute('data-active', j === k));
        if (cv) {
          const it = items[k];
          cv.querySelector('[data-cv-gre]').textContent = it.dataset.gre;
          cv.querySelector('[data-cv-det]').textContent = it.dataset.det;
          run(cv, [{ opacity: .4, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 450 });
        }
      };
      const next = () => { if (tok !== this.seq) return; pick((cur + 1) % items.length); this.later(next, hold); };
      items.forEach((it, j) => { it.onclick = (e) => { e.stopPropagation(); pick(j, true); }; });
      this.later(next, +box.dataset.start || 2500);
    });
  }
  renderVals() { return {}; }
}
</script>
