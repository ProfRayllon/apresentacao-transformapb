<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transforma Educação PB 2026</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#000;visibility:hidden;pointer-events:none}
iframe.ativa{visibility:visible;pointer-events:auto}
</style>
</head>
<body>
<iframe id="transforma" title="Transforma Educação PB 2026" allow="fullscreen" allowfullscreen src="Transforma%20Educacao%20PB%202026.dc.html"></iframe>
<iframe id="jornada" title="Jornada Formativa" allow="fullscreen" allowfullscreen src="Jornada/Main.dc.html"></iframe>
<script>
(function () {
  var titulos = { transforma: 'Transforma Educação PB 2026', jornada: 'Jornada Formativa' };
  window.mostrar = function (nome) {
    Object.keys(titulos).forEach(function (k) { document.getElementById(k).classList.toggle('ativa', k === nome); });
    history.replaceState(null, '', nome === 'jornada' ? '#jornada' : location.pathname);
    document.title = titulos[nome];
    try { document.getElementById(nome).contentWindow.focus(); } catch (e) {}
  };
  var inicio = location.hash === '#jornada' ? 'jornada' : 'transforma';
  window.mostrar(inicio);
  document.getElementById(inicio).addEventListener('load', function () { window.mostrar(inicio); });
})();
</script>
</body>
</html>
